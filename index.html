<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>魚類図鑑</title>
  <style>
    :root { --dark:#083344; --main:#0f766e; --light:#ccfbf1; --paper:#f8fafc; --text:#172554; --sub:#475569; --line:#cbd5e1; --white:#fff; --danger:#be123c; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--text); background:var(--paper); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; }
    header { padding:28px 20px 22px; color:#fff; background:linear-gradient(135deg,var(--dark),var(--main)); }
    header p { margin:0 0 6px; font-size:12px; letter-spacing:.1em; opacity:.85; }
    h1 { margin:0; font-size:28px; }
    main { max-width:760px; margin:auto; padding:20px 16px 48px; }
    .search { position:relative; margin-bottom:12px; }
    .search span { position:absolute; top:50%; left:16px; transform:translateY(-50%); font-size:20px; }
    #searchInput { width:100%; padding:15px 16px 15px 48px; border:1px solid var(--line); border-radius:14px; outline:none; color:var(--text); background:var(--white); font-size:16px; }
    #searchInput:focus, input:focus, textarea:focus, select:focus { border-color:var(--main); outline:none; box-shadow:0 0 0 3px rgba(15,118,110,.18); }
    .filters { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 0 14px; }
    .filters select { min-width:0; padding:11px 8px; border:1px solid var(--line); border-radius:10px; color:var(--text); background:var(--white); font:inherit; font-size:13px; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:14px 0; }
    #summary { margin:0; color:var(--sub); font-size:14px; font-weight:700; }
    button { border:0; border-radius:12px; padding:12px 15px; color:#fff; background:var(--main); font:inherit; font-weight:700; cursor:pointer; }
    button.secondary,.close { color:var(--text); background:#e2e8f0; }
    button.danger { background:var(--danger); }
    #fishList { display:grid; gap:16px; }
    .card { overflow:hidden; border:1px solid var(--line); border-radius:18px; background:var(--white); box-shadow:0 6px 18px rgba(15,23,42,.08); }
    .photo { display:grid; min-height:130px; place-items:center; background:linear-gradient(135deg,#cffafe,#e0f2fe); font-size:50px; }
    .cardBody { padding:19px; }
    .tag { display:inline-block; margin-bottom:10px; padding:5px 10px; border-radius:999px; color:#115e59; background:var(--light); font-size:12px; font-weight:700; }
    .name { margin:0; font-size:27px; }
    .scientific { margin:5px 0 3px; color:var(--sub); font-size:17px; font-style:italic; }
    .english { margin:0 0 15px; color:var(--sub); font-size:14px; }
    dl { margin:0; }
    .item { display:grid; grid-template-columns:96px 1fr; gap:8px; padding:11px 0; border-top:1px solid #e2e8f0; }
    dt { color:var(--sub); font-size:13px; font-weight:700; }
    dd { margin:0; font-size:14px; line-height:1.65; overflow-wrap:anywhere; }
    .cardActions { display:flex; justify-content:flex-end; margin-top:16px; padding-top:14px; border-top:1px solid #e2e8f0; }
    .editButton { padding:10px 14px; font-size:14px; }
    .empty { padding:30px 18px; border:1px dashed var(--line); border-radius:14px; color:var(--sub); background:var(--white); text-align:center; line-height:1.7; }
    .modal { position:fixed; z-index:10; inset:0; display:none; overflow-y:auto; padding:18px; background:rgba(15,23,42,.52); }
    .modal.open { display:block; }
    .modalBox { max-width:700px; margin:18px auto; padding:20px; border-radius:18px; background:var(--white); }
    .modalHead { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
    .modalHead h2 { margin:0; font-size:22px; }
    .close { padding:8px 12px; }
    .formGrid { display:grid; grid-template-columns:1fr 1fr; gap:13px; }
    .wide { grid-column:1 / -1; }
    label { display:block; margin-bottom:5px; color:var(--sub); font-size:13px; font-weight:700; }
    input,textarea,select { width:100%; padding:11px; border:1px solid var(--line); border-radius:10px; color:var(--text); background:#fff; font:inherit; }
    textarea { min-height:82px; resize:vertical; }
    .formButtons { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
    .note { color:var(--sub); font-size:12px; line-height:1.65; }
    @media (max-width:520px) { .formGrid { grid-template-columns:1fr; } .wide { grid-column:auto; } .item { grid-template-columns:86px 1fr; } }
  </style>
</head>
<body>
  <header><p>MY PERSONAL DATABASE</p><h1>魚類図鑑</h1></header>
  <main>
    <div class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="和名・学名・英名・分類名で検索" autocomplete="off"></div>
    <div class="filters">
      <select id="classFilter" aria-label="綱で絞り込む"><option value="">綱：すべて</option></select>
      <select id="orderFilter" aria-label="目で絞り込む"><option value="">目：すべて</option></select>
      <select id="familyFilter" aria-label="科で絞り込む"><option value="">科：すべて</option></select>
    </div>
    <div class="toolbar"><p id="summary"></p><button id="openForm">＋ 魚種を追加</button></div>
    <section id="fishList"></section>
  </main>
  <div id="modal" class="modal">
    <div class="modalBox">
      <div class="modalHead"><h2 id="modalTitle">魚種を追加</h2><button id="closeForm" class="close" type="button">閉じる</button></div>
      <form id="fishForm">
        <div class="formGrid">
          <div><label>和名 *</label><input name="japaneseName" required placeholder="例：ネコザメ"></div>
          <div><label>学名</label><input name="scientificName" placeholder="例：Heterodontus japonicus"></div>
          <div class="wide"><label>英名</label><input name="englishName" placeholder="例：Japanese bullhead shark"></div>
          <div><label>綱</label><input name="className" placeholder="例：軟骨魚綱"></div>
          <div><label>目</label><input name="order" placeholder="例：ネコザメ目"></div>
          <div><label>科</label><input name="family" placeholder="例：ネコザメ科"></div>
          <div><label>属</label><input name="genus" placeholder="例：ネコザメ属"></div>
          <div class="wide"><label>分布</label><textarea name="distribution"></textarea></div>
          <div class="wide"><label>生息環境</label><textarea name="habitat"></textarea></div>
          <div><label>水深</label><input name="depth" placeholder="例：10〜100 m"></div>
          <div><label>最大全長</label><input name="maxLength" placeholder="例：100 cm"></div>
          <div><label>IUCN評価</label><select name="iucn"><option value="">未入力</option><option>LC</option><option>NT</option><option>VU</option><option>EN</option><option>CR</option><option>EW</option><option>EX</option><option>DD</option><option>NE</option></select></div>
          <div class="wide"><label>展示水族館・展示記録</label><textarea name="aquariumRecord"></textarea></div>
          <div class="wide"><label>出典URL</label><input name="sourceUrl" type="url" placeholder="https://"></div>
          <div class="wide"><label>備考</label><textarea name="note"></textarea></div>
        </div>
        <p class="note">写真の追加・編集・削除・JSONバックアップは、次の工程で実装します。</p>
        <div class="formButtons"><button type="button" id="cancelForm" class="secondary">キャンセル</button><button type="submit" id="submitForm">この内容で登録</button></div>
      </form>
    </div>
  </div>
  <script>
    const DB_NAME = "fishEncyclopediaDB";
    const STORE_NAME = "fish";
    let db;
    let fishData = [];
    let editingId = null;
    const defaultFish = { japaneseName:"ネコザメ", scientificName:"Heterodontus japonicus", englishName:"Japanese bullhead shark", className:"軟骨魚綱", order:"ネコザメ目", family:"ネコザメ科", genus:"ネコザメ属", distribution:"北西太平洋：日本、朝鮮半島、中国北部〜台湾周辺", habitat:"沿岸の岩礁・藻場を中心とする底生性のサメ", depth:"おおむね水深6〜100 m", maxLength:"", iucn:"", aquariumRecord:"", sourceUrl:"", note:"写真、展示記録、観察記録、出典等は今後追加する。" };
    const searchInput = document.getElementById("searchInput");
    const fishList = document.getElementById("fishList");
    const summary = document.getElementById("summary");
    const modal = document.getElementById("modal");
    const fishForm = document.getElementById("fishForm");
    const classFilter = document.getElementById("classFilter");
    const orderFilter = document.getElementById("orderFilter");
    const familyFilter = document.getElementById("familyFilter");
    const modalTitle = document.getElementById("modalTitle");
    const submitForm = document.getElementById("submitForm");
    function openDB() { return new Promise((resolve,reject) => { const request=indexedDB.open(DB_NAME,1); request.onupgradeneeded=(event)=>{ db=event.target.result; if(!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME,{keyPath:"id",autoIncrement:true}); }; request.onsuccess=(event)=>{db=event.target.result;resolve();}; request.onerror=()=>reject(request.error); }); }
    function getAllFish() { return new Promise((resolve,reject)=>{ const request=db.transaction(STORE_NAME,"readonly").objectStore(STORE_NAME).getAll(); request.onsuccess=()=>resolve(request.result); request.onerror=()=>reject(request.error); }); }
    function addFish(fish) { return new Promise((resolve,reject)=>{ const request=db.transaction(STORE_NAME,"readwrite").objectStore(STORE_NAME).add(fish); request.onsuccess=()=>resolve(); request.onerror=()=>reject(request.error); }); }
    function updateFish(fish) { return new Promise((resolve,reject)=>{ const request=db.transaction(STORE_NAME,"readwrite").objectStore(STORE_NAME).put(fish); request.onsuccess=()=>resolve(); request.onerror=()=>reject(request.error); }); }
    function normalize(text) { return String(text || "").normalize("NFKC").toLowerCase(); }
    function escapeHTML(text) { return String(text || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
    function searchableText(fish) { return [fish.japaneseName,fish.scientificName,fish.englishName,fish.className,fish.order,fish.family,fish.genus,fish.distribution,fish.habitat,fish.iucn,fish.aquariumRecord,fish.note].join(" "); }
