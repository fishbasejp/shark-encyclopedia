<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魚類図鑑</title>
<style>
:root{--m:#0f766e;--d:#083344;--p:#f8fafc;--t:#172554;--s:#475569;--l:#cbd5e1}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--t);font-family:-apple-system,"Hiragino Sans",sans-serif}header{padding:28px 20px;color:#fff;background:linear-gradient(135deg,var(--d),var(--m))}header p{margin:0;font-size:12px;letter-spacing:.1em}h1{margin:7px 0 0}main{max-width:760px;margin:auto;padding:20px 16px}input,textarea,select{width:100%;padding:11px;border:1px solid var(--l);border-radius:10px;font:inherit}.search input{padding:15px;font-size:16px}.filters,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.bar,.head,.buttons{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0}button{border:0;border-radius:12px;padding:12px 15px;background:var(--m);color:#fff;font:inherit;font-weight:700}.cancel{background:#e2e8f0;color:var(--t)}.card{margin:16px 0;overflow:hidden;border:1px solid var(--l);border-radius:18px;background:#fff}.photo{position:relative;display:grid;min-height:130px;place-items:center;background:#cffafe;font-size:50px;border:3px solid var(--frame);border-radius:15px 15px 0 0;overflow:visible}.photo img{width:100%;height:130px;object-fit:cover;border-radius:12px 12px 0 0}.alien{position:absolute;right:14px;bottom:-15px;z-index:2;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--l);border-radius:50%;background:#fff;color:#C45ACF;font-size:22px;font-weight:800;box-shadow:0 2px 6px #17255444}.body{padding:19px}.tag{display:inline-block;padding:5px 10px;border-radius:999px;background:#ccfbf1;color:#115e59;font-size:12px;font-weight:700}.name{font-size:27px;margin:18px 0 4px}.sci,.eng{margin:5px 0;color:var(--s)}.sci{font-style:italic;font-size:17px}.item{display:grid;grid-template-columns:86px 1fr;gap:8px;padding:11px 0;border-top:1px solid #e2e8f0}.item b{color:var(--s)}.actions{text-align:right;margin-top:14px}.modal{display:none;position:fixed;z-index:9;inset:0;overflow:auto;padding:18px;background:#0f172a88}.modal.on{display:block}.box{max-width:700px;margin:auto;padding:20px;border-radius:18px;background:#fff}label{display:block;margin:11px 0 4px;color:var(--s);font-size:13px;font-weight:700}textarea{min-height:76px}.wide{grid-column:1/-1}.empty{padding:30px;text-align:center;color:var(--s)}@media(max-width:520px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head>
<body><header><p>MY PERSONAL DATABASE</p><h1>魚類図鑑</h1></header><main><div class="search"><input id="q" placeholder="和名・学名・英名・分類名で検索"></div><div class="filters"><select id="cf"><option value="">綱：すべて</option></select><select id="of"><option value="">目：すべて</option></select><select id="ff"><option value="">科：すべて</option></select></div><div class="bar"><b id="sum"></b><button id="add">＋ 魚種を追加</button></div><section id="list"></section></main><div id="modal" class="modal"><div class="box"><div class="head"><h2 id="title"></h2><button id="close" class="cancel">閉じる</button></div><form id="form"><div id="fields" class="grid"></div><div class="buttons"><button type="button" id="cancel" class="cancel">キャンセル</button><button id="save">保存</button></div></form></div></div>
<script>
const DB='fishEncyclopediaDB',ST='fish',$=x=>document.getElementById(x),F=[['japaneseName','和名 *',''],['scientificName','学名',''],['englishName','英名','wide'],['className','綱',''],['order','目',''],['family','科',''],['genus','属',''],['distribution','分布','area'],['habitat','生息環境','area'],['depth','水深',''],['maxLength','最大全長',''],['iucn','IUCN評価',''],['aquariumRecord','展示記録','area'],['sourceUrl','出典URL',''],['note','備考','area']],C={ordinary:'#2E8B57',southern:'#84B547',islands:'#35A7D6',overseas:'#C45ACF'};let db,data=[],editing=null;const esc=x=>String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');$('fields').innerHTML=F.map(([n,l,t])=>`<div class="${t==='wide'?'wide':''}"><label>${l}</label>${t==='area'?`<textarea name="${n}"></textarea>`:`<input name="${n}" ${n==='japaneseName'?'required':''}>`}</div>`).join('')+`<div class="wide"><label>分布・出現区分</label><select name="distributionType"><option value="ordinary">本土の河川・近海域の普通種</option><option value="southern">南方系・本土記録あり</option><option value="islands">南西諸島・小笠原限定</option><option value="overseas">海外産</option></select></div><div class="wide"><label><input name="isInvasive" value="1" type="checkbox" style="width:auto"> 外来種として扱う（◇を表示）</label></div><div class="wide"><label>写真</label><input name="photoFile" type="file" accept="image/*"><label><input name="removePhoto" type="checkbox" style="width:auto"> 現在の写真を削除する</label></div>`;function all(){return new Promise((y,n)=>{let r=db.transaction(ST).objectStore(ST).getAll();r.onsuccess=()=>y(r.result);r.onerror=()=>n(r.error)})}function put(x){return new Promise((y,n)=>{let r=db.transaction(ST,'readwrite').objectStore(ST).put(x);r.onsuccess=y;r.onerror=()=>n(r.error)})}function options(e,k,l){let v=e.value,a=[...new Set(data.map(x=>x[k]).filter(Boolean))];e.innerHTML=`<option value="">${l}：すべて</option>`+a.map(x=>`<option>${esc(x)}</option>`).join('');e.value=a.includes(v)?v:''}function rows(x){return [['分類',[x.className,x.order,x.family,x.genus].filter(Boolean).join('／')],['分布',x.distribution],['生息環境',x.habitat],['水深',x.depth],['最大全長',x.maxLength],['IUCN',x.iucn],['展示記録',x.aquariumRecord],['出典URL',x.sourceUrl],['備考',x.note]].map(a=>a[1]?`<div class="item"><b>${a[0]}</b><span>${esc(a[1])}</span></div>`:'').join('')}function draw(){let t=$('q').value.toLowerCase(),r=data.filter(x=>(!t||F.map(a=>x[a[0]]).join(' ').toLowerCase().includes(t))&&(!$('cf').value||x.className===$('cf').value)&&(!$('of').value||x.order===$('of').value)&&(!$('ff').value||x.family===$('ff').value));$('sum').textContent=`登録種：${data.length}種　表示：${r.length}種`;$('list').innerHTML=r.length?r.map(x=>{let src=x.photo?URL.createObjectURL(x.photo):'';return `<article class="card"><div class="photo" style="--frame:${C[x.distributionType||'ordinary']}">${src?`<img src="${src}" alt="${esc(x.japaneseName)}">`:'🦈'}${x.isInvasive==='1'?'<span class="alien">◇</span>':''}</div><div class="body"><span class="tag">${esc([x.order,x.family].filter(Boolean).join('・'))}</span><h2 class="name">${esc(x.japaneseName)}</h2><p class="sci">${esc(x.scientificName)}</p><p class="eng">${esc(x.englishName)}</p>${rows(x)}<div class="actions"><button class="edit" data-id="${x.id}">編集する</button></div></div></article>`}).join(''):'<div class="empty">該当する魚種が見つかりません。</div>'}async function load(){data=await all();options($('cf'),'className','綱');options($('of'),'order','目');options($('ff'),'family','科');draw()}function open(x){editing=x?.id??null;$('form').reset();if(x){F.forEach(a=>$('form').elements[a[0]].value=x[a[0]]||'');form.elements.distributionType.value=x.distributionType||'ordinary';form.elements.isInvasive.checked=x.isInvasive==='1'}$('title').textContent=x?'魚種を編集':'魚種を追加';$('save').textContent=x?'変更を保存':'この内容で登録';$('modal').classList.add('on')}function close(){$('modal').classList.remove('on')}$('add').onclick=()=>open();$('close').onclick=$('cancel').onclick=close;[$('q'),$('cf'),$('of'),$('ff')].forEach(x=>{x.oninput=draw;x.onchange=draw});$('list').onclick=e=>{let b=e.target.closest('.edit');if(b)open(data.find(x=>x.id==b.dataset.id))};$('form').onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));delete x.photoFile;delete x.removePhoto;if(!x.isInvasive)x.isInvasive='';if(editing!==null){let old=data.find(a=>a.id===editing);x.id=editing;x.photo=old?.photo||null}if(e.target.elements.removePhoto.checked)x.photo=null;if(e.target.elements.photoFile.files[0])x.photo=e.target.elements.photoFile.files[0];await put(x);close();load()};let r=indexedDB.open(DB,1);r.onupgradeneeded=e=>{db=e.target.result;if(!db.objectStoreNames.contains(ST))db.createObjectStore(ST,{keyPath:'id',autoIncrement:true})};r.onsuccess=e=>{db=e.target.result;load()};
</script></body></html>
