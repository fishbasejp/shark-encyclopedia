<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魚類図鑑</title><style>:root{--m:#0f766e;--d:#083344;--p:#f8fafc;--t:#172554;--s:#475569;--l:#cbd5e1}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--t);font-family:-apple-system,"Hiragino Sans",sans-serif}header{padding:28px 20px 22px;color:#fff;background:linear-gradient(135deg,var(--d),var(--m))}header p{margin:0 0 6px;font-size:12px;letter-spacing:.1em}h1{margin:0;font-size:28px}main{max-width:760px;margin:auto;padding:20px 16px 48px}input,textarea,select{width:100%;padding:11px;border:1px solid var(--l);border-radius:10px;color:var(--t);font:inherit}textarea{min-height:76px}.search{margin-bottom:12px}.search input{padding:15px;font-size:16px;border-radius:14px}.filters,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}button{border:0;border-radius:12px;padding:12px 15px;background:var(--m);color:#fff;font:inherit;font-weight:700}.card{overflow:hidden;margin:16px 0;border:1px solid var(--l);border-radius:18px;background:#fff;box-shadow:0 6px 18px #17255414}.photo{display:grid;min-height:130px;place-items:center;background:#cffafe;font-size:50px}.body{padding:19px}.tag{display:inline-block;margin-bottom:10px;padding:5px 10px;border-radius:999px;background:#ccfbf1;color:#115e59;font-size:12px;font-weight:bold}.name{margin:0;font-size:27px}.sci,.eng{margin:5px 0;color:var(--s)}.sci{font-style:italic;font-size:17px}.eng{margin-bottom:15px}dl{margin:0}.item{display:grid;grid-template-columns:86px 1fr;gap:8px;padding:11px 0;border-top:1px solid #e2e8f0}dt{color:var(--s);font-size:13px;font-weight:bold}dd{margin:0;line-height:1.6;overflow-wrap:anywhere}.actions{display:flex;justify-content:flex-end;margin-top:14px}.modal{position:fixed;inset:0;z-index:5;display:none;overflow:auto;padding:18px;background:#0f172a88}.modal.on{dis {esc(a.japaneseName)}</h2>${a.scientificName?`<p class="sci">${esc(a.scientificName)}</p>`:''}${a.englishName?`<p class="eng">${esc(a.englishName)}</p>`:''}<dl>${row('分類',[a.className,a.order,a.family,a.genus].filter(Boolean).join('／'))}${row('分布',a.distribution)}${row('生息環境',a.habitat)}${row('水深',a.depth)}${row('最大全長',a.maxLength)}${row('IUCN',a.iucn)}${row('展示記録',a.aquariumRecord)}${row('出典URL',a.sourceUrl)}${row('備考',a.note)}</dl><div class="actions"><button class="edit" data-id="${a.id}">編集する</button></div></div></article>`).join(''):'<div class="empty">該当する魚種が見つかりません。</div>'}async function load(){A=await all();opts(c,'className','綱');opts(o,'order','目');opts(f,'family','科');draw()}function open(x){edit=x?.id??null;form.reset();if(x)K.forEach(k=>form.elements[k[0]].value=x[k[0]]||'');$('title').textContent=x?'魚種を編集':'魚種を追加';$('save').textContent=x?'変更を保存':'この内容で登録';modal.classList.add('on')}function shut(){modal.classList.remove('on')}$('add').onclick=()=>open();$('close').onclick=$('cancel').onclick=shut;[q,c,o,f].forEach(x=>x.oninput=draw);list.onclick=e=>{let b=e.target.closest('.edit');if(b)open(A.find(a=>a.id==b.dataset.id))};form.onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(form));Object.keys(x).forEach(k=>x[k]=x[k].trim());if(edit!==null)x.id=edit;await put(x);shut();await load()};let r=indexedDB.open(N,1);r.onupgradeneeded=e=>{db=e.target.result;if(!db.objectStoreNames.contains(S))db.createObjectStore(S,{keyPath:'id',autoIncrement:true})};r.onsuccess=async e=>{db=e.target.result;if(!(await all()).length)await put(D);load()};r.onerror=()=>list.innerHTML='<div class="empty">データベースを開始できませんでした。</div>';</script></html>
